services:
  jobd:
    image: ghcr.io/openabstractions/jobd
    container_name: jobd
    restart: unless-stopped
    read_only: true
    # the owner of the store folder: `id -u` and `id -g` on the NAS
    user: "1024:100"
    volumes:
      - /volume1/docker/jobd:/store
      - /etc/ssl/certs:/etc/ssl/certs:ro
    environment:
      ABSTRACTION_CRED_HF: ${ABSTRACTION_CRED_HF:-}
    healthcheck:
      test: ["CMD", "/jobd", "status", "--exit-code"]
      interval: 60s
      timeout: 10s
